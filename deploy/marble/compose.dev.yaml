services:
  robins-reserve-dev:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: robins-reserve:1.4.0-dev
    container_name: robins-reserve-bot-dev
    restart: unless-stopped
    env_file: [../../.env.dev]
    volumes:
      - robins_dev_data:/app/data
      - robins_dev_logs:/app/logs
      - ../../secrets/google-service-account.json:/app/secrets/google-service-account.json:ro,z
    security_opt: ["no-new-privileges:true"]

  squarespace-import-dev:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: robins-reserve:1.4.0-dev
    container_name: robins-squarespace-import-dev
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        sleep 20
        while true; do
          python tasks/squarespace_import.py --days 30
          sleep 300
        done
    env_file:
      - ../../.env.dev
    volumes:
      - robins_dev_data:/app/data
      - robins_dev_logs:/app/logs
      - ../../secrets/google-service-account.json:/app/secrets/google-service-account.json:ro,z
    depends_on:
      robins-api-dev:
        condition: service_healthy
    networks:
      - default
    security_opt:
      - no-new-privileges:true

  robins-api-dev:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: robins-reserve:1.4.0-dev
    container_name: robins-reserve-api-dev
    command: ["uvicorn", "dashboard_api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    env_file: [../../.env.dev]
    volumes:
      - robins_dev_data:/app/data
      - robins_dev_logs:/app/logs
      - ../../secrets/google-service-account.json:/app/secrets/google-service-account.json:ro,z
    expose: ["8000"]
    networks: [default, proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    security_opt: ["no-new-privileges:true"]

  cloudflared-dev:
    image: cloudflare/cloudflared:latest
    container_name: robins-cloudflared-dev
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    depends_on:
      robins-api-dev:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  robins_dev_data:
  robins_dev_logs:

networks:
  proxy:
    external: true
