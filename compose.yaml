services:
  robins-reserve:
    build:
      context: .
      dockerfile: Dockerfile

    image: robins-reserve:1.3.0-dev
    container_name: robins-reserve-robincon-dev

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - robincon_data:/app/data
      - robincon_logs:/app/logs
      - ./secrets/google-service-account.json:/app/secrets/google-service-account.json:ro,Z

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; sys.exit(0 if pathlib.Path('/app/logs/robins_reserve.log').exists() else 1)\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

volumes:
  robincon_data:
  robincon_logs:
